name: CI/CD Pipeline

on:
  push:
    branches: [ sample_v1 ]
  pull_request:
    branches: [ sample_v1 ]
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ✅ STEP 2: Run tests (optional)
      - name: Run tests
        run: ant -Dlibs.CopyLibs.classpath=ant-lib/copylibs.jar test

      # ✅ STEP 3: Build with the property
      - name: Build WAR
        run: ant -Dlibs.CopyLibs.classpath=ant-lib/copylibs.jar clean dist

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/*.war